name: CI

# Third-party actions are pinned by immutable digest, never by tag or branch: a tag can
# be moved and a branch tip always moves, so either would let upstream change what runs
# against this checkout without a commit here. The trailing comment records the human
# version each digest corresponds to — update both together.
#
# dtolnay/rust-toolchain is pinned to `master` rather than its `stable` / `1.88`
# branches, because those branches select the toolchain by their *name*. Pinning them
# would freeze the name away, so the toolchain moves to an explicit `toolchain:` input.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catches undefined matrix keys, bad job/step keys, and shell mistakes that a
      # plain YAML parser accepts.
      # Bump this digest BY HAND: Dependabot's github-actions ecosystem only tracks
      # `owner/repo@ref`, so a `docker://` reference gets no update PRs.
      - name: Lint workflow files
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features tokio -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The scope API — its intra-doc links into `tokio::` and its doctest — only
      # exists with the feature, so the default run above never sees it.
      - run: cargo doc --no-deps --features tokio
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, not just the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - run: cargo build --examples
      # The panic-hook tests spawn fixture processes via nested `cargo run`, so this
      # job compiles the crate three times over; it is slower than it looks.
      - run: cargo test
      # Insurance, not coverage: the crate declares no default features, so today
      # this is byte-for-byte the same build as `cargo test` above and reports the
      # same test count. It is here so that adding `default = ["tokio"]` later
      # cannot silently stop the featureless build from being tested.
      - run: cargo test --no-default-features
      - run: cargo test --features tokio

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # Quoted: bare 1.88 is a YAML float, and a future 1.90 would arrive as "1.9".
          # Keep in step with `rust-version` in Cargo.toml.
          toolchain: "1.88"
      - run: cargo check --all-targets
